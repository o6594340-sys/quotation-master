<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quotation Generator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel">
        <h1>Сборщик сметы</h1>
        <p>Загрузите прайсы и программу, чтобы запустить MVP-поток обработки.</p>

        <form id="quote-form">
          <label class="field">
            <span>Программа</span>
            <input type="file" id="program-sources" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,.md,.json,.csv" />
            <small class="hint">Можно загрузить программу в Word, Excel, PDF, TXT и других простых форматах.</small>
          </label>

          <label class="field">
            <span>Прайсы</span>
            <input type="file" id="sources" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,.md,.json,.csv" />
          </label>

          <label class="field">
            <span>Как составлять смету</span>
            <div class="option-group">
              <label class="option-card">
                <input type="radio" name="program-mode" value="program_only" checked />
                <span>Смета исключительно на основе загруженной программы</span>
              </label>
              <label class="option-card">
                <input type="radio" name="program-mode" value="mix_budget" />
                <span>Сделать микс из нескольких программ с приоритетом на более бюджетную</span>
              </label>
              <label class="option-card">
                <input type="radio" name="program-mode" value="mix_interest" />
                <span>Сделать микс из нескольких программ с приоритетом на более интересную/полезную</span>
              </label>
            </div>
            <small class="hint">Для режимов микса система попросит минимум 2 программы.</small>
          </label>

          <label class="field">
            <span>Шаблон сметы</span>
            <input type="file" id="template-file" accept=".txt,.md,.docx,.xlsx,.json,.csv" />
            <small class="hint">Если у вашей компании есть свой формат сметы, загрузите шаблон — мы применим его автоматически.</small>
          </label>

          <label class="field">
            <span>Стратегия</span>
            <select id="strategy">
              <option value="lowest_price">Минимальная цена</option>
              <option value="single_supplier">Один поставщик</option>
              <option value="mixed">Смешанная стратегия</option>
            </select>
          </label>

          <label class="field">
            <span>Язык итоговой сметы</span>
            <select id="output-language">
              <option value="keep_english">Оставить на английском</option>
              <option value="translate_russian">Перевести на качественный русский</option>
            </select>
            <small class="hint">Для русского мы используем более естественный перевод без буквальной кальки.</small>
          </label>

          <button type="submit">Создать задачу</button>
        </form>

        <section id="estimate-preview" class="estimate-preview" aria-live="polite">
          <div class="estimate-card">
            <h2>Предпросмотр сметы</h2>
          <div id="workflow-progress" class="workflow-progress">
            <div class="progress-steps">
              <span class="step-pill active">Received</span>
              <span class="step-pill">Extracting</span>
              <span class="step-pill">Matching</span>
              <span class="step-pill">Ready</span>
            </div>
            <div class="progress-bar" aria-hidden="true">
              <div id="progress-fill" class="progress-fill"></div>
            </div>
          </div>
            <p class="placeholder">После создания задачи здесь появится структура сметы.</p>
          </div>
        </section>
        <pre id="result">Ожидание данных...</pre>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
